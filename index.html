  const step = steps[current];
  const response = responses[current];

  document.documentElement.dir = arabic ? "rtl" : "ltr";
  document.title = step.title + " | CGRC";

  toggle.lang = arabic ? "en" : "ar";

  get("rail-caption").textContent = ui.rail;
  get("meta").textContent = ui.meta;
  get("steps").setAttribute("aria-label", ui.sections);
  get("pager").setAttribute("aria-label", ui.pager);
  get("position").textContent = (current + 1) + " " + ui.of + " " + steps.length + " · " + step.tab;
  get("title").textContent = step.title;
  get("lead").textContent = step.lead;
  get("evidence-title").textContent = ui.evidence;
  get("task-title").textContent = ui.task;
  get("instruction").textContent = step.instruction;
  get("records").replaceChildren(...step.records.map(record => {
    const p = document.createElement("p");
    p.textContent = record;
    return p;
  }));
  get("steps").replaceChildren(...steps.map((entry, i) => {
    const link = document.createElement("a");
    const number = document.createElement("span");
    number.textContent = String(i + 1).padStart(2, "0");
    link.href = "#/" + (i + 1);
    link.append(number, document.createTextNode(entry.tab));
    if (current === i) link.setAttribute("aria-current", "step");
    return link;
  }));

  get("decision").hidden = !step.choices;
  get("question").textContent = step.question ?? "";
  get("check").textContent = ui.check;
  get("choices").replaceChildren(...(step.choices ?? []).map((choice, i) => {
    const label = document.createElement("label");
    const input = document.createElement("input");
    input.type = "radio";
    input.name = "decision";
    input.value = String(i);
    input.required = true;
    input.checked = response.choice === i;
    label.className = "choice";
    label.append(input, document.createTextNode(choice));
    return label;
  }));
  showFeedback();
  const last = current === steps.length - 1;
  get("notes-area").hidden = current === 0;
  get("notes-label").textContent = ui.notes;
  get("notes").value = response.notes;
  get("download").hidden = !last;
  get("download").textContent = ui.download;
  get("previous").hidden = current === 0;
  get("previous").href = "#/" + current;
  get("previous").textContent = ui.previous;
  get("next").hidden = last;
  get("next").href = "#/" + (current + 2);
  get("next").textContent = current === 0 ? ui.start : ui.next;
  if (moveFocus) get("title").focus();
}

function showFeedback() {
  const response = responses[current];
  const panel = get("feedback");
  panel.hidden = !response.checked;
  panel.textContent = response.checked ? content[language].steps[current].feedback[response.choice] : "";
}

get("language").addEventListener("click", () => {
  language = language === "en" ? "ar" : "en";
  render();
});
get("decision").addEventListener("change", event => {
  responses[current].choice = Number(event.target.value);
  responses[current].checked = false;
  showFeedback();
});
get("decision").addEventListener("submit", event => {
  event.preventDefault();
  responses[current].checked = true;
  showFeedback();
});
get("notes").addEventListener("input", event => {
  responses[current].notes = event.target.value;
});
get("download").addEventListener("click", () => {
  const {ui, steps} = content[language];
  const report = steps.slice(1).map((step, i) => {
    const {choice, notes} = responses[i + 1];
    const decision = step.choices ? step.choices[choice] ?? ui.noAnswer : "";
    return [step.tab, decision, notes].filter(Boolean).join("\n");
  });
  const blob = new Blob(["\uFEFF", ["CGRC · " + ui.day, ...report].join("\n\n")], {type: "text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "cgrc-day-3-team-record.txt";
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
window.addEventListener("hashchange", () => render(true));
render();
</script>
</body>
</html>
